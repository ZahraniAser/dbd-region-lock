name: Build Windows app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m pip install pytest pyinstaller
          python -m pytest -q

      - name: Build DBDRegionLock.exe
        run: >-
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin
          --name DBDRegionLock --icon assets\icon.ico --add-data "assets\icon.ico;assets"
          dbd_region_lock_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: DBDRegionLock
          path: dist/DBDRegionLock.exe

      # Every push to main replaces the "latest" release, so the newest .exe is always one click away.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/DBDRegionLock.exe \
            --target "$GITHUB_SHA" --title "DBD Region Lock (latest build)" \
            --notes "Download DBDRegionLock.exe and double-click it. Built from $GITHUB_SHA."
